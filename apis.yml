  name: FDC3
  description: >-
    FDC3 is an open standard for financial desktop interoperability, defining how applications launch,
    share context, and resolve intents across the financial desktop. The standard includes a Desktop Agent
    API and an App Directory specification.
  humanURL: https://fdc3.finos.org/
  tags:
