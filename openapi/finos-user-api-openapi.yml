          examples:
            application/json:
              code: 500
              message: // Server error, see response body for further details.
definitions:
  UserIdList:
    type: array
    items:
      type: integer
      format: int64
    example:
    - 7215545058313
    - 7215545078461
  Password:
    description: Password. Stored as derived password in both the Pod and the Key Manager using PBKDF2 function. Number of iterations should be 10000 and desired length 256 bits.
    type: object
    properties:
      hSalt:
        description: Pod password salt used for PBKDF2 derivation.
        type: string
        example: hsalt
      hPassword:
        description: Pod password derived with PBKDF2.
        type: string
        example: hpassword
      khSalt:
        description: Key Manager password salt used for PBKDF2 derivation.
        type: string
        example: khsalt
      khPassword:
        description: Key Manager password derived with PBKDF2.
        type: string
        example: khpassword
  V2UserAttributes:
    description: V2 User record.
    type: object
    properties:
      emailAddress:
        type: string
        example: johndoe@symphony.com
      firstName:
        type: string
        example: John
      lastName:
        type: string
        example: Doe
      userName:
        type: string
        example: johndoe
      displayName:
        type: string
        example: John Doe
      companyName:
        type: string
        example: Company
      department:
        type: string
        example: Department
      division:
        type: string
        example: Division
      title:
        type: string
        example: Trader
      workPhoneNumber:
        type: string
        example: '+15419999999'
      mobilePhoneNumber:
        type: string
        example: '+15419999999'
      twoFactorAuthPhone:
        type: string
        example: '+15419999999'
      smsNumber:
        type: string
        example: '+15419999999'
      accountType:
        type: string
        enum:
        - NORMAL
        - SYSTEM
        - SDL
        example: NORMAL
      location:
        type: string
        example: New York
      recommendedLanguage:
        type: string
        example: english
      jobFunction:
        type: string
        example: Trader
      assetClasses:
        type: array
        items:
          type: string
        example:
        - Equities
      industries:
        type: array
        items:
          type: string
        example:
        - Healthcare
        - Technology
      marketCoverage:
        type: array
        items:
          type: string
        example:
        - EMEA
      responsibility:
        type: array
        items:
          type: string
        example:
        - BAU
      function:
        type: array
        items:
          type: string
        example:
        - Trade Processing
      instrument:
        type: array
        items:
          type: string
        example:
        - Equities
      currentKey:
        $ref: '#/definitions/V2UserKeyRequest'
      previousKey:
        $ref: '#/definitions/V2UserKeyRequest'
      userMetadata:
        type: object
        description: Metadata map of key/values
        additionalProperties:
          type: object
        example:
          com_symphony_metadataKey1: value
          com_symphony_metadataKey2:
          - value1
          - value2
  AvatarList:
    type: array
    items:
      $ref: '#/definitions/Avatar'
    example:
    - size: original
      url: ../avatars/izcQTdRVFOK_qhCrYeQOpIuHKuZuMk3J88Uz_bShzM8.png
    - size: small
      url: ../avatars/izcQTdRVFOK_qhCrYeQOpIuHKuZuMk3J88Uz_bShzM8_small.png
  V2UserCreate:
    description: 'V2 User Creation Object.

      After creation, modify roles, features etc via the specific API calls.

      '
    type: object
    properties:
      userAttributes:
        $ref: '#/definitions/V2UserAttributes'
      password:
        $ref: '#/definitions/Password'
      roles:
        type: array
        items:
          type: string
        example:
        - INDIVIDUAL
        - COMPLIANCE_OFFICER
  RoleDetailList:
    type: array
