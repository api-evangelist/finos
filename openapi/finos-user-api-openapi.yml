        type: string
        example: Jane
      lastName:
        type: string
        example: Doe
      userName:
        type: string
        example: jane.doe
      displayName:
        type: string
        example: Jane Doe
      companyName:
        type: string
        example: Company
      department:
        type: string
        example: Department
      division:
        type: string
        example: Division
      title:
        type: string
