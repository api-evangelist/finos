components:
  schemas:
    Error:
      type: object
      properties:
        code:
          type: integer
          format: int32
          example: 401
        message:
          type: string
          example: Invalid session
    CompanyCertDetail:
      type: object
      properties:
        companyCertAttributes:
          $ref: '#/components/schemas/CompanyCertAttributes'
        companyCertInfo:
          $ref: '#/components/schemas/CompanyCertInfo'
        certInfo:
          $ref: '#/components/schemas/CertInfo'
    CertInfoItem:
      type: object
      properties:
        name:
          type: string
          example: Public Key
        attributes:
          type: array
          items:
            $ref: '#/components/schemas/NameValuePair'
          example:
          - name: Algorithm
            value: RSA
          - name: Format
            value: X.509
    NameValuePair:
      type: object
      properties:
        name:
          type: string
          example: Algorithm
        value:
          type: string
          example: RSA
    CompanyCert:
      type: object
      properties:
        pem:
          type: string
          description: An X509 certificate in PEM format
          example: '-----BEGIN CERTIFICATE-----MIIH/TC...p9DBiB/-----END CERTIFICATE-----'
        attributes:
          $ref: '#/components/schemas/CompanyCertAttributes'
    CertInfo:
      type: array
      items:
        $ref: '#/components/schemas/CertInfoItem'
      example:
      - name: Validity
        attributes:
        - name: Not Before
          value: Mon Jan 15 20:56:05 UTC 2018
        - name: Not After
          value: Thu Jan 15 20:56:05 UTC 2026
      - name: Public Key
        attributes:
        - name: Algorithm
          value: RSA
        - name: Format
          value: X.509
    CompanyCertTypeList:
      type: array
      items:
        $ref: '#/components/schemas/CompanyCertType'
    CompanyCertStatus:
      type: object
      properties:
        type:
          type: string
          enum:
          - TRUSTED
          - KNOWN
          - REVOKED
          - DISABLED
          example: TRUSTED
    CompanyCertInfo:
      type: object
      properties:
        fingerPrint:
          type: string
          description: Unique identifier
          example: 300a...
        issuerFingerPrint:
          type: string
          description: Unique identifier of issuer cert if known
          example: 450s...
        lastSeen:
          type: integer
          format: int64
          description: Date when we last saw this certificate presented
          example: 0
        updatedAt:
          type: integer
          format: int64
          description: Date when this cert was last updated by administrator
          example: 0
        updatedBy:
          type: integer
          format: int64
          description: User ID of administrator who last updated this cert
          example: 0
        commonName:
          type: string
          description: The Symphony account name which this certificate authenticates
          example: agentservice
        expiryDate:
          type: integer
          format: int64
          description: Expiry date of this cert
          example: 1781886755000
    CompanyCertInfoList:
      type: array
      items:
        type: object
        properties:
          companyCertAttributes:
            $ref: '#/components/schemas/CompanyCertAttributes'
          companyCertInfo:
            $ref: '#/components/schemas/CompanyCertInfo'
        example:
        - companyCertAttributes:
            name: agentservice
            type:
              type: USER
            status:
              type: TRUSTED
          companyCertInfo:
            fingerPrint: 300a...
            lastSeen: 0
            updatedAt: 0
            updatedBy: 0
            commonName: agentservice
            expiryDate: 1781886755000
    CompanyCertType:
      type: object
      properties:
        type:
          type: string
          enum:
          - USERSIGNING
          - USER
          - OPERATIONSSIGNING
          - OPERATIONSUSER
          example: USER
    CompanyCertAttributes:
      type: object
      properties:
        name:
          type: string
          description: Friendly name assigned by administrator
          example: agentservice
        type:
          $ref: '#/components/schemas/CompanyCertType'
        status:
          $ref: '#/components/schemas/CompanyCertStatus'
    StringId:
      type: object
      properties:
        id:
          type: string
          example: xhGxbTcvTDK6EIMMrwdOrX___quztr2HdA
    SuccessResponse:
      type: object
      properties:
        format:
          type: string
          enum:
          - TEXT
          - XML
          example: TEXT
        message:
          type: string
          example: Success
