openapi: 3.2.0
info:
  version: 20.14.1
  title: Authenticator Certificate Authentication API
  description: For bots and other on-premise processes to authenticate.
tags:
- name: CertificateAuthentication
paths:
  /v1/authenticate:
    post:
      summary: Authenticate
      description: 'Based on the SSL client certificate presented by the TLS layer, authenticate

        the API caller and return a session token.'
      tags:
      - CertificateAuthentication
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token'
        '400':
          description: Client error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 'Forbidden: Certificate authentication is not allowed for the requested user.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error, see response body for further details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      operationId: postV1Authenticate
      x-operation-id-source: derived
  /v1/logout:
    post:
      summary: Logout
      description: Logout a users session.
      parameters:
      - name: sessionToken
        description: the session token to logout.
        in: header
        required: true
        schema:
          type: string
      tags:
      - CertificateAuthentication
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Client error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 'Forbidden: Certificate authentication is not allowed for the requested user.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error, see response body for further details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      operationId: postV1Logout
      x-operation-id-source: derived
components:
  schemas:
    Token:
      type: object
      properties:
        name:
          description: 'The name of the header in which the token should be presented on subsequent API calls.

            '
          type: string
        token:
          type: string
          description: 'Authentication token that should be passed as header in each API rest calls.

            This should be considered opaque data by the client. It is not intended to contain any data interpretable by the

            client. The format is secret and subject to change without notice.

            '
        authorizationToken:
          type: string
          description: "(Beta) Short lived access token built from a user session. This field is still on Beta, please continue using \nthe returned \"token\" instead.\n"
    Error:
      type: object
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
    SuccessResponse:
      type: object
      properties:
        message:
          type: string
