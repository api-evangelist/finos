openapi: 3.2.0
info:
  version: 20.17.1
  title: Pod Message Suppression API
  description: 'This document refers to Symphony API calls that do not need

    encryption or decryption of content.'
servers:
- url: https://yourpodURL.symphony.com/pod
tags:
- name: MessageSuppression
paths:
  /v1/admin/messagesuppression/{id}/suppress:
    post:
      summary: Suppress a message
      parameters:
      - name: id
        description: URL-Safe encoded Message ID
        in: path
        required: true
        schema:
          type: string
      - name: sessionToken
        description: Session authentication token.
        in: header
        required: true
        schema:
          type: string
      tags:
      - MessageSuppression
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageSuppressionResponse'
        '400':
          description: Client error, see response body for further details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: 400
                message: // Client error, see response body for further details.
        '401':
          description: 'Unauthorized: Invalid session token.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: 401
                message: Invalid session
        '403':
          description: 'Forbidden: Caller lacks necessary entitlement.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: 403
                message: The user lacks the required entitlement to perform this operation
        '500':
          description: Server error, see response body for further details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: 500
                message: // Server error, see response body for further details.
      operationId: postV1AdminMessagesuppressionByIdSuppress
      x-operation-id-source: derived
components:
  schemas:
    Error:
      type: object
      properties:
        code:
          type: integer
          format: int32
          example: 401
        message:
          type: string
          example: Invalid session
    MessageSuppressionResponse:
      description: The suppression state of a message
      type: object
      properties:
        messageId:
          type: string
          example: _Gj13MiR-5IrVtrmPNl6fn___qvWCYI_dA
        suppressed:
          type: boolean
          example: true
        suppressionDate:
          type: integer
          format: int64
          description: The date when this message was suppressed.
          example: 1461565603191
