components:
  schemas:
    UserId:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 7215545058313
    MembershipList:
      description: List of members in a room.
      type: array
      items:
        $ref: '#/components/schemas/MemberInfo'
      example:
      - id: 7078106103900
        owner: false
        joinDate: 1461430710531
      - id: 7078106103809
        owner: true
        joinDate: 1461426797875
      - id: 7078106103810
        owner: true
        joinDate: 1461426797833
        addedThroughGroups:
        - 68719476744
    MemberInfo:
      description: Detailed membership record.
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 7078106103810
        owner:
          type: boolean
          example: true
        joinDate:
          type: integer
          format: int64
          example: 1461426797833
        addedThroughGroups:
          description: When the user has been added to the stream through a group (aka SDL), this array contains the group ID which the user belongs to. Since SBE 20.14.
          x-since: 20.14
          type: array
          items:
            type: integer
            format: int64
          example:
          - 68719476744
    Error:
      type: object
      properties:
        code:
          type: integer
          format: int32
          example: 401
        message:
          type: string
          example: Invalid session
    SuccessResponse:
      type: object
      properties:
        format:
          type: string
          enum:
          - TEXT
          - XML
          example: TEXT
        message:
          type: string
          example: Success
